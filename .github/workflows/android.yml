name: Compiler l'appli

# À chaque envoi de code : lancer les tests, compiler l'appli,
# et mettre le fichier APK à télécharger dans l'onglet "Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests de compréhension des phrases
        run: ./gradlew testDebugUnitTest

      - name: Compiler l'APK de test
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-vocal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier le rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
